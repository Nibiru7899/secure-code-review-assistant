[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-code-review"
version = "0.1.0"
description = "Local Case Study 4 secure code debugging and review assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-c==0.24.1",
    "tree-sitter-cpp==0.23.4",
    "chromadb==1.0.20",
    "transformers==4.48.3",
    "torch==2.6.0",
    "numpy==2.2.6",
    "einops==0.8.1",
    "fastapi==0.116.1",
    "pydantic==2.13.5",
    "streamlit==1.50.0",
    "psycopg[binary]==3.2.10",
]

[tool.setuptools.packages.find]
include = ["app*", "ui*"]

